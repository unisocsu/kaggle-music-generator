name: Run queued music jobs on Kaggle
on:
  issues:
    types: [labeled]
  workflow_dispatch:
  repository_dispatch:
    types: [music-job-queued]
  schedule:
    - cron: "*/10 * * * *"
permissions:
  contents: write
  issues: write
concurrency:
  group: kaggle-gpu-music-queue
  cancel-in-progress: false
jobs:
  process-queue:
    if: github.event_name != 'issues' || github.event.label.name == 'queued'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install Kaggle CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade six kaggle
          python -c "import six, kaggle; print('Kaggle CLI ready')"
      - name: Configure Kaggle credentials
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          test -n "$KAGGLE_KEY" || (echo "Missing KAGGLE_KEY repository secret" && exit 1)
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_KEY" | tr -d '\r\n' > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"
          echo "KAGGLE_API_TOKEN=$(cat "$HOME/.kaggle/access_token")" >> "$GITHUB_ENV"
      - name: Process queued issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KAGGLE_USER_NAME: ${{ secrets.KAGGLE_USER_NAME }}
          KAGGLE_POLL_SECONDS: "45"
        run: |
          test -n "$KAGGLE_USER_NAME" || (echo "Missing KAGGLE_USER_NAME repository secret" && exit 1)
          python scripts/process_kaggle_queue.py
