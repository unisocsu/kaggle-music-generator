name: Validate music workers

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python workers
        run: python -m py_compile scripts/process_kaggle_queue.py kaggle/session_worker.py
      - name: Validate Kaggle notebook JSON
        run: python -c "import json; json.load(open('kaggle/notebook/worker.ipynb', encoding='utf-8'))"
