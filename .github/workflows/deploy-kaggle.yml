name: Deploy Kaggle worker notebook

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "kaggle/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Kaggle API token
        env:
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          test -n "$KAGGLE_KEY" || (echo "Missing KAGGLE_KEY secret" && exit 1)
          mkdir -p "$HOME/.kaggle"
          printf '%s' "$KAGGLE_KEY" > "$HOME/.kaggle/access_token"
          chmod 600 "$HOME/.kaggle/access_token"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Prepare Kaggle notebook metadata
        env:
          KAGGLE_USER_NAME: ${{ secrets.KAGGLE_USER_NAME }}
        run: |
          test -n "$KAGGLE_USER_NAME" || (echo "Missing KAGGLE_USER_NAME secret" && exit 1)
          python - <<'PY'
          import json, os
          path = "kaggle/notebook/kernel-metadata.json"
          with open(path) as f:
              data = json.load(f)
          data["id"] = os.environ["KAGGLE_USER_NAME"] + "/kaggle-music-generator-worker"
          with open(path, "w") as f:
              json.dump(data, f, indent=2)
          PY

      - name: Push notebook to Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
        run: kaggle kernels push -p kaggle/notebook
