name: Validate Kaggle notebook template
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["kaggle/**","scripts/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate notebook and scripts
        run: |
          python -m pip install nbformat
          python - <<'PY'
          import json, nbformat
          from pathlib import Path
          p=Path("kaggle/notebook/worker.ipynb")
          nb=nbformat.read(p,as_version=4)
          nbformat.validate(nb)
          assert any(c.get("id")=="session" and "session_worker.py" in "".join(c.source) for c in nb.cells)
          meta=json.loads(Path("kaggle/notebook/kernel-metadata.json").read_text())
          assert meta["code_file"]=="worker.ipynb"
          print("Persistent Kaggle notebook template and metadata are valid.")
          PY
          python -m py_compile kaggle/worker.py kaggle/session_worker.py scripts/prepare_kaggle_notebook.py scripts/process_kaggle_queue.py
